services:
  joshilab-mcp:
    build: .
    image: ghcr.io/joshi-labs/joshilab-mcp:latest
    container_name: joshilab-mcp
    restart: unless-stopped
    privileged: true
    pid: "host"
    network_mode: "host"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SERVER_NAME=HostTerminalBridge
      - PUBLIC_URL=https://host.vpjoshi.in
      - OAUTH_CLIENT_ID=joshilab-client
      - OAUTH_CLIENT_SECRET=joshilab-secret-2026